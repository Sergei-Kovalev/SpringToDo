services:
  PostgreSQL:
    image: postgres:16.0
    container_name: PostgreSQL
    user: root
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "todos_db"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bcsm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - postgres

  redis:
    container_name: redis-for-todo
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - postgres

  todo-app:
    image: todo-app
    user: root
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9009:9009"
    depends_on:
      - PostgreSQL
      - redis
    networks:
      - postgres

networks:
  postgres:
    driver: bridge

volumes:
  pgdata:
  redisdata: