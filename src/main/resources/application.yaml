server:
  port: 9009

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
#    url: jdbc:postgresql.yaml://localhost:5432/todos_db
#    url: jdbc:postgresql://PostgreSQL:5432/todos_db
    url: jdbc:postgresql://postgres:5432/todos_db
    username: postgres
    password: postgres
    hikari:
      schema: public

  autoconfigure:
    exclude:

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: false
    show-sql: true
    hibernate:
      ddl-auto: none

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: localhost
      port: 6379
      jedis:
        pool:
          time-between-eviction-runs: 10m

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: SpringToDo
    version: 1.0.0
    description: week3 1st task